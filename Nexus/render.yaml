# Blueprint path from repository root: Nexus/render.yaml. Not deployed by this file.
services:
  - type: web
    name: nexus-relay
    runtime: node
    plan: 0.5c-512mb # Paid proposal; approval required before creating the service.
    numInstances: 1 # No autoscaling: relayV1 supports one writer.
    region: oregon
    branch: desarrollo
    rootDir: Nexus
    buildCommand: npm ci
    startCommand: npm run relay
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_ADMIN_CREDENTIALS
        sync: false
